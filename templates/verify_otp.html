{% extends "base.html" %}
{% block title %}Verify Email{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card fade-in">
        <div class="text-center mb-4">
            <div class="auth-logo text-primary">
                <i class="bi bi-shield-check"></i>
            </div>
            <h2>Verify Your Email</h2>
            <p class="auth-subtitle">
                Enter the 6-digit code sent to<br>
                <strong class="text-light">{{ email }}</strong>
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.verify_otp') }}" id="otpForm">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="mb-4">
                <label for="otp" class="form-label text-center d-block">6-Digit Verification Code</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="text" class="form-control text-center fs-4 fw-bold letter-spacing-lg"
                           id="otp" name="otp" maxlength="6" pattern="\d{6}"
                           placeholder="••••••" required autocomplete="one-time-code" autofocus>
                </div>
                <div class="form-text text-center text-muted small mt-2">
                    Code expires in 10 minutes.
                </div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2 mb-3" id="verifyBtn">
                <i class="bi bi-check-circle me-2"></i>Verify & Continue
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
            <p class="text-muted small mb-2">Didn't receive the code?</p>
            <button type="button" class="btn btn-glass btn-sm" id="resendBtn" onclick="resendCode()">
                <i class="bi bi-arrow-clockwise me-1"></i><span id="resendText">Resend Code</span>
            </button>
            <div id="cooldownText" class="text-muted small mt-2 d-none">
                You can request another code in <span id="cooldownTimer" class="fw-bold text-primary">60</span>s
            </div>
        </div>
    </div>
</div>

<script>
let cooldownSeconds = 0;
let timerInterval = null;

function startCooldown(seconds) {
    cooldownSeconds = seconds;
    const btn = document.getElementById('resendBtn');
    const cooldownDiv = document.getElementById('cooldownText');
    const timerSpan = document.getElementById('cooldownTimer');

    btn.disabled = true;
    cooldownDiv.classList.remove('d-none');
    timerSpan.textContent = cooldownSeconds;

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
        cooldownSeconds--;
        timerSpan.textContent = cooldownSeconds;
        if (cooldownSeconds <= 0) {
            clearInterval(timerInterval);
            btn.disabled = false;
            cooldownDiv.classList.add('d-none');
            document.getElementById('resendText').textContent = 'Resend Code';
        }
    }, 1000);
}

function resendCode() {
    const btn = document.getElementById('resendBtn');
    btn.disabled = true;
    document.getElementById('resendText').textContent = 'Sending...';

    const formData = new FormData();
    formData.append('email', '{{ email }}');
    formData.append('otp_type', 'registration');

    fetch("{{ url_for('auth.resend_otp') }}", {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            alert(data.message);
            startCooldown(60);
        } else {
            alert(data.message);
            btn.disabled = false;
            document.getElementById('resendText').textContent = 'Resend Code';
        }
    })
    .catch(err => {
        alert('Failed to resend code. Please try again.');
        btn.disabled = false;
        document.getElementById('resendText').textContent = 'Resend Code';
    });
}
</script>
{% endblock %}
