{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="text-center fade-in">
        <div style="font-size: 6rem; color: var(--danger); opacity: 0.4;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="mb-3">500 — Server Error</h1>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-gradient">
            <i class="bi bi-house me-2"></i>Go Home
        </a>
    </div>
</div>
{% endblock %}
