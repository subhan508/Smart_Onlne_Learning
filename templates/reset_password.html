{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card fade-in">
        <div class="text-center mb-4">
            <div class="auth-logo text-primary">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h2>New Password</h2>
            <p class="auth-subtitle">
                Enter the recovery code sent to<br>
                <strong class="text-light">{{ email }}</strong>
            </p>
        </div>

        <form method="POST" action="{{ url_for('auth.reset_password') }}">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="mb-3">
                <label for="otp" class="form-label">6-Digit Recovery Code</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="text" class="form-control text-center fs-5 fw-bold"
                           id="otp" name="otp" maxlength="6" pattern="\d{6}"
                           placeholder="••••••" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Min. 8 chars, mixed case, number, symbol" required minlength="8">
                </div>
                <div class="form-text small text-muted">
                    Must include uppercase, lowercase, number, and special symbol.
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Repeat new password" required minlength="8">
                </div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2 mb-3">
                <i class="bi bi-check2-circle me-2"></i>Update Password & Sign In
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
            <a href="{{ url_for('auth.login') }}" class="btn btn-glass btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Cancel & Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
