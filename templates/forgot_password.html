{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card fade-in">
        <div class="text-center mb-4">
            <div class="auth-logo text-primary">
                <i class="bi bi-key"></i>
            </div>
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your registered email address to receive a 6-digit recovery code.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="mb-4">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="you@example.com" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2 mb-3">
                <i class="bi bi-send me-2"></i>Send Recovery Code
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
            <a href="{{ url_for('auth.login') }}" class="btn btn-glass btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
