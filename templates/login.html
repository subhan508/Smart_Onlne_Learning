{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card fade-in">
        <div class="text-center mb-4">
            <div class="auth-logo">
                <i class="bi bi-mortarboard-fill"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to continue your learning journey</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email"
                           placeholder="you@example.com"
                           value="{{ email if email else '' }}" required autocomplete="email">
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label text-muted small" for="remember">
                        Remember me
                    </label>
                </div>
                <a href="{{ url_for('auth.forgot_password') }}" class="text-primary small text-decoration-none">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-2 mb-3" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>

        <div class="text-center">
            <p class="text-muted small mb-2">Don't have an account?</p>
            <a href="{{ url_for('auth.register') }}" class="btn btn-glass btn-sm">
                <i class="bi bi-person-plus me-1"></i>Create Account
            </a>
        </div>


    </div>
</div>
{% endblock %}
